# ---------------------------------------------------------------------------
# EXPERIMENTAL. Not tested on a Raspberry Pi Zero 2W (or any real screen).
# The image builds and the entry points start, but whether pygame can drive a display via
# SDL_VIDEODRIVER=kmsdrm from inside a container with the pip wheel is UNVERIFIED. The supported
# way to run the frame is the native install (install.sh + systemd).
# ---------------------------------------------------------------------------
# Three services from one image:
#   display - shows the photos (needs /dev/dri and the host's video/render groups)
#   webui   - settings and remote on http://<host>:5000
#   sync    - photo sync every sync.interval_minutes, calendar every 30 min, "sync" button of the web UI
#
# This file only pulls the published image (pin a version with FRAMELINK_FRAME_TAG=v1.2.3).
# To build it from a checkout of the repository instead:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up --build
#
# Setup:   mkdir config && chown 1000 config   (the containers run as uid 1000 and the web UI writes config.yaml)
#          docker compose up -d                (first start copies an example config.yaml into ./config)
#          edit config/config.yaml: registry.url and registry.api_key
# "render" has a different gid on every host: if the display container cannot open /dev/dri, replace the
# group names below by the numeric gids (ls -ln /dev/dri).

x-frame: &frame
  image: ghcr.io/ykoellmann/framelink-frame:${FRAMELINK_FRAME_TAG:-latest}
  restart: unless-stopped
  environment: &env
    TZ: Europe/Berlin
    FRAMELINK_CONFIG: /config/config.yaml
    FRAMELINK_IPC_DIR: /ipc
  volumes:
    - ./config:/config
    - cache:/var/lib/framelink/cache   # sync.cache_dir of the example config
    - ipc:/ipc

services:
  display:
    <<: *frame
    command: display
    devices: ["/dev/dri:/dev/dri"]
    group_add: [video, render]
    environment:
      <<: *env
      SDL_VIDEODRIVER: kmsdrm

  webui:
    <<: *frame
    command: webui
    ports: ["5000:5000"]

  sync:
    <<: *frame
    command: sync

volumes:
  cache:
  ipc:
